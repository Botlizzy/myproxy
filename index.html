<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Link Bypasser – Supports VPlink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(255,0,0,0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
            border: 2px solid #ff0000;
        }
        h1 {
            color: #ff0000;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        .sub {
            color: #333;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .input-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        label {
            font-weight: 600;
            color: #222;
            text-align: left;
            display: block;
        }
        input[type="text"] {
            padding: 14px 18px;
            border-radius: 12px;
            border: 2px solid #ccc;
            font-size: 16px;
            transition: 0.3s;
            width: 100%;
            background: #f9f9f9;
            color: #111;
        }
        input[type="text"]:focus {
            border-color: #ff0000;
            outline: none;
            box-shadow: 0 0 0 3px rgba(255,0,0,0.2);
        }
        .btn {
            background: #ff0000;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            background: #cc0000;
            transform: scale(0.98);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .result-area {
            margin-top: 25px;
            background: #f0f0f0;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #ddd;
        }
        .result-area input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px 5px;
            font-size: 14px;
            color: #111;
            word-break: break-all;
        }
        .copy-btn {
            background: #222;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            white-space: nowrap;
        }
        .copy-btn:hover {
            background: #111;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .badge {
            display: inline-block;
            background: #ff0000;
            color: white;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 5px;
        }
        @media (max-width: 500px) {
            .container { padding: 25px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 Link Bypasser</h1>
        <p class="sub">Supports <strong>VPlink</strong> & all ad/short links</p>

        <div class="input-area">
            <label for="adlink">Paste Ad / Short Link</label>
            <input type="text" id="adlink" placeholder="https://vplink.net/xyz... or any ad link" />
        </div>
        <button class="btn" id="bypassBtn">▶ Get Destination</button>

        <div class="result-area" style="display: none;" id="resultArea">
            <input type="text" id="destLink" readonly placeholder="Final destination will appear here" />
            <button class="copy-btn" id="copyBtn">📋 Copy</button>
        </div>
        <div id="status">Paste a link and hit the button</div>
        <div class="footer">⚡ Bypasses HTTP, JS, Meta, and Base64 redirects</div>
    </div>

    <script>
        const adInput = document.getElementById('adlink');
        const bypassBtn = document.getElementById('bypassBtn');
        const resultArea = document.getElementById('resultArea');
        const destInput = document.getElementById('destLink');
        const copyBtn = document.getElementById('copyBtn');
        const status = document.getElementById('status');

        bypassBtn.addEventListener('click', async () => {
            const url = adInput.value.trim();
            if (!url) {
                status.textContent = '⚠️ Please paste a link first.';
                resultArea.style.display = 'none';
                return;
            }
            status.textContent = '⏳ Resolving (following redirects & JS)...';
            resultArea.style.display = 'none';

            try {
                const response = await fetch('bypass.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'url=' + encodeURIComponent(url)
                });
                const data = await response.json();
                if (data.success) {
                    destInput.value = data.destination;
                    resultArea.style.display = 'flex';
                    status.textContent = '✅ Destination found!';
                } else {
                    status.textContent = '❌ ' + data.error;
                }
            } catch (err) {
                status.textContent = '❌ Network error: ' + err.message;
            }
        });

        copyBtn.addEventListener('click', () => {
            destInput.select();
            document.execCommand('copy');
            copyBtn.textContent = '✅ Copied!';
            setTimeout(() => { copyBtn.textContent = '📋 Copy'; }, 2000);
        });
    </script>
</body>
</html>
